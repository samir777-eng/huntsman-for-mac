# Copyright (C) 2026 Huntsman for Mac contributors
# The Windows build (experimental, unsigned): PyInstaller one-folder build of packaging/windows/huntsman.spec,
# a headless smoke test of the frozen Huntsman.exe (--version, --self-test: imports and data, no keyboard, no
# window), zipped as Huntsman-for-Windows-<version>.zip. Runs by hand (workflow_dispatch) and on pushes that touch
# the packaging, for an artifact; publishing a release also attaches the zip to that release, from a separate job
# that alone may write to the repository and that fails unless the tag (minus a leading v) is the built version.
# Event values reach scripts only through env, never as ${{ }} inside a script.
name: Windows build

on:
  workflow_dispatch:
  push:
    paths:
      - packaging/windows/**
      - platforms/bundle.py
      - requirements-win.txt
      - .github/workflows/windows-build.yml
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    outputs:
      version: ${{ steps.version.outputs.version }}
      zip: ${{ steps.zip.outputs.zip }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-win.txt
      - name: Install
        run: python -m pip install -r requirements-win.txt pyinstaller==6.22.3 pyinstaller-hooks-contrib==2026.10
      - name: Version
        id: version
        shell: pwsh
        run: |
          "version=$(python -c 'import huntsman_core; print(huntsman_core.__version__)')" >> $env:GITHUB_OUTPUT
          "log=$(python -c 'import platforms; print(platforms.log_path())')" >> $env:GITHUB_OUTPUT
      - name: Build
        run: pyinstaller --noconfirm --clean packaging/windows/huntsman.spec
      - name: Smoke test the frozen exe
        shell: pwsh
        timeout-minutes: 5
        env:
          LOG: ${{ steps.version.outputs.log }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # A windowed exe has no console: Huntsman.exe writes to its log file (platforms.log_path()).
          $log = $env:LOG
          Remove-Item -ErrorAction SilentlyContinue $log
          $exe = "dist\Huntsman\Huntsman.exe"
          $v = Start-Process -FilePath $exe -ArgumentList "--version" -Wait -PassThru
          $t = Start-Process -FilePath $exe -ArgumentList "--self-test" -Wait -PassThru
          Get-Content $log
          if ($v.ExitCode -ne 0) { throw "--version exited with $($v.ExitCode)" }
          if ($t.ExitCode -ne 0) { throw "--self-test exited with $($t.ExitCode)" }
          if (-not (Select-String -Path $log -SimpleMatch "Huntsman for Mac $env:VERSION" -Quiet)) { throw "no version line" }
          if (-not (Select-String -Path $log -SimpleMatch "self-test passed" -Quiet)) { throw "self-test did not pass" }
      - name: Zip
        id: zip
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $zip = "Huntsman-for-Windows-$env:VERSION.zip"
          Compress-Archive -Path dist\Huntsman -DestinationPath $zip
          "zip=$zip" >> $env:GITHUB_OUTPUT
          "{0:N1} MB" -f ((Get-Item $zip).Length / 1MB)
      - uses: actions/upload-artifact@v5
        with:
          name: Huntsman-for-Windows-${{ steps.version.outputs.version }}
          path: ${{ steps.zip.outputs.zip }}
          if-no-files-found: error

  release:
    needs: build
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: Huntsman-for-Windows-${{ needs.build.outputs.version }}
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.event.release.tag_name }}
          VERSION: ${{ needs.build.outputs.version }}
          ZIP: ${{ needs.build.outputs.zip }}
        run: |
          if [ "${TAG#v}" != "$VERSION" ]; then
            echo "::error::release tag $TAG doesn't match the built version $VERSION"
            exit 1
          fi
          gh release upload "$TAG" "$ZIP" --clobber
