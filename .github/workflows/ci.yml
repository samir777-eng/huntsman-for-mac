# The test suite on macOS and on Windows (simulated keyboard, fake transports, headless Chromium UI tests).
# On Windows, tests that need macOS-only pieces are skipped (tests/conftest.py, marker mac_only).
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install (macOS)
        if: runner.os == 'macOS'
        run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Install (Windows)
        if: runner.os == 'Windows'
        run: python -m pip install -r requirements-win.txt -r requirements-dev.txt
      - name: Install Chromium for the UI tests
        run: python -m playwright install chromium
      - name: Run the tests
        run: python -m pytest -q -rs tests
