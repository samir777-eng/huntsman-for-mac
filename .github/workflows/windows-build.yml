# SPDX-License-Identifier: GPL-3.0-or-later
# Copyright (C) 2026 Huntsman for Mac contributors
# The Windows build (experimental, unsigned): PyInstaller one-folder build of packaging/windows/huntsman.spec,
# a headless smoke test of the frozen Huntsman.exe (--version, --self-test: imports and data, no keyboard, no
# window), zipped as Huntsman-for-Windows-<version>.zip. Then the installer wizard: Microsoft's WebView2 bootstrapper
# is downloaded (never committed), a pinned Inno Setup compiles packaging/windows/huntsman.iss into
# Huntsman-for-Windows-<version>-Setup.exe, and a silent install / reinstall / uninstall is smoke-tested here.
# Runs by hand (workflow_dispatch) and on pushes that touch the packaging, for artifacts; publishing a release also
# attaches the zip and the Setup.exe to that release, from a separate job that alone may write to the repository
# and that fails unless the tag (minus a leading v) is the built version. GitHub-hosted runners only.
# Event values reach scripts only through env, never as ${{ }} inside a script.
name: Windows build

on:
  workflow_dispatch:
  push:
    paths:
      - packaging/windows/**
      - platforms/**
      - app.py
      - service.py
      - ipc.py
      - huntsman_core.py
      - studio.py
      - models.py
      - depth_stream.py
      - menubar.py
      - lighting/**
      - inputs/**
      - ui/**
      - layouts/**
      - layout.json
      - keymap.json
      - tests/test_win_installer.py
      - requirements-win.txt
      - .github/workflows/windows-build.yml
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 40
    outputs:
      version: ${{ steps.version.outputs.version }}
      zip: ${{ steps.zip.outputs.zip }}
      setup: ${{ steps.setup.outputs.setup }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-win.txt
      - name: Install
        run: python -m pip install -r requirements-win.txt pyinstaller==6.22.3 pyinstaller-hooks-contrib==2026.10
      - name: Version
        id: version
        shell: pwsh
        run: |
          "version=$(python -c 'import huntsman_core; print(huntsman_core.__version__)')" >> $env:GITHUB_OUTPUT
          "log=$(python -c 'import platforms; print(platforms.log_path())')" >> $env:GITHUB_OUTPUT
      - name: Build
        run: pyinstaller --noconfirm --clean packaging/windows/huntsman.spec
      - name: Smoke test the frozen exe
        shell: pwsh
        timeout-minutes: 5
        env:
          LOG: ${{ steps.version.outputs.log }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # A windowed exe has no console: Huntsman.exe writes to its log file (platforms.log_path()).
          $log = $env:LOG
          Remove-Item -ErrorAction SilentlyContinue $log
          $exe = "dist\Huntsman\Huntsman.exe"
          $v = Start-Process -FilePath $exe -ArgumentList "--version" -Wait -PassThru
          $t = Start-Process -FilePath $exe -ArgumentList "--self-test" -Wait -PassThru
          Get-Content $log
          if ($v.ExitCode -ne 0) { throw "--version exited with $($v.ExitCode)" }
          if ($t.ExitCode -ne 0) { throw "--self-test exited with $($t.ExitCode)" }
          if (-not (Select-String -Path $log -SimpleMatch "Huntsman for Mac $env:VERSION" -Quiet)) { throw "no version line" }
          if (-not (Select-String -Path $log -SimpleMatch "self-test passed" -Quiet)) { throw "self-test did not pass" }
      - name: Zip
        id: zip
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $zip = "Huntsman-for-Windows-$env:VERSION.zip"
          Compress-Archive -Path dist\Huntsman -DestinationPath $zip
          "zip=$zip" >> $env:GITHUB_OUTPUT
          "{0:N1} MB" -f ((Get-Item $zip).Length / 1MB)
      - uses: actions/upload-artifact@v5
        with:
          name: Huntsman-for-Windows-${{ steps.version.outputs.version }}
          path: ${{ steps.zip.outputs.zip }}
          if-no-files-found: error
      - name: WebView2 bootstrapper
        shell: pwsh
        run: |
          # Microsoft's Evergreen bootstrapper, from its official link; it goes into the installer, never into git.
          $out = "dist\MicrosoftEdgeWebview2Setup.exe"
          Invoke-WebRequest -Uri "https://go.microsoft.com/fwlink/p/?LinkId=2124703" -OutFile $out -UseBasicParsing
          $sig = Get-AuthenticodeSignature $out
          "{0} / {1}" -f $sig.Status, $sig.SignerCertificate.Subject
          if ($sig.Status -ne "Valid") { throw "the bootstrapper's signature is $($sig.Status)" }
          if ($sig.SignerCertificate.Subject -notmatch "O=Microsoft Corporation") { throw "not signed by Microsoft" }
      - name: Inno Setup
        id: inno
        shell: pwsh
        run: |
          # Pinned: whatever the image has preinstalled is replaced by this version.
          $pin = "6.7.1"
          choco install innosetup --version $pin -y --no-progress --allow-downgrade --force
          if ($LASTEXITCODE -ne 0) { throw "choco install innosetup $pin failed" }
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { throw "ISCC.exe not found at $iscc" }
          # ISCC.exe carries no file version (reads 0.0.0.0), so ask choco which version it installed
          $got = ((choco list innosetup --exact --limit-output) -split '\|')[1]
          "Inno Setup $got"
          if ($got -ne $pin) { throw "Inno Setup is $got, not $pin" }
          "iscc=$iscc" >> $env:GITHUB_OUTPUT
      - name: Build the installer
        id: setup
        shell: pwsh
        env:
          ISCC: ${{ steps.inno.outputs.iscc }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          & $env:ISCC "/DAppVersion=$env:VERSION" packaging\windows\huntsman.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed ($LASTEXITCODE)" }
          $setup = "Huntsman-for-Windows-$env:VERSION-Setup.exe"
          if (-not (Test-Path "dist\$setup")) { throw "dist\$setup is missing" }
          "setup=$setup" >> $env:GITHUB_OUTPUT
          "{0:N1} MB" -f ((Get-Item "dist\$setup").Length / 1MB)
      - name: Smoke test the installer
        shell: pwsh
        timeout-minutes: 15
        env:
          LOG: ${{ steps.version.outputs.log }}
          SETUP: ${{ steps.setup.outputs.setup }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $setup = (Resolve-Path "dist\$env:SETUP").Path
          $dir = Join-Path $env:LOCALAPPDATA "Programs\Huntsman for Mac"
          $exe = Join-Path $dir "Huntsman.exe"
          $data = Join-Path $env:APPDATA "Huntsman for Mac"
          $state = Join-Path $data "state.json"
          $runKey = "HKCU:\Software\Microsoft\Windows\CurrentVersion\Run"
          if (-not (Test-Path $runKey)) { New-Item -Path $runKey -Force | Out-Null }   # absent on a fresh runner profile
          $runName = "Huntsman for Mac lighting"
          $uninstKey = "HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\{3B18B4A2-4894-4CDB-9662-6307C10A5D1F}_is1"
          $menu = Join-Path $env:APPDATA "Microsoft\Windows\Start Menu\Programs\Huntsman for Mac.lnk"
          function Ours { @(Get-CimInstance Win32_Process -Filter "Name = 'Huntsman.exe'" | Where-Object { $_.ExecutablePath -eq $exe }) }
          function Services { @(Ours | Where-Object { $_.CommandLine -match '--service' }) }
          function Install($name) {
            $log = Join-Path $env:RUNNER_TEMP "$name.log"
            # Setup.exe waits for its own .tmp child; -Wait would also wait for the lighting service an upgrade restarts
            $p = Start-Process -FilePath $setup -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/LOG=`"$log`"" -PassThru
            $p.WaitForExit()
            Get-Content $log | Out-Host
            if ($p.ExitCode -ne 0) { throw "$name exited with $($p.ExitCode)" }
            return $log
          }
          function StartService {
            Start-Process -FilePath $exe -ArgumentList "--service" | Out-Null
            for ($i = 0; $i -lt 20 -and -not (Services).Count; $i++) { Start-Sleep -Seconds 1 }
            Start-Sleep -Seconds 5   # past its start-up
            $n = (Services).Count
            "service processes running: $n" | Out-Host
            if (-not $n) { Get-Content -ErrorAction SilentlyContinue $env:LOG | Out-Host; throw "the lighting service didn't come up" }
          }
          function StartWindow {
            # The window (no arguments). A hosted runner may not show a WebView2 window: then only a warning.
            Start-Process -FilePath $exe | Out-Null
            for ($i = 0; $i -lt 30; $i++) {
              $w = @(Ours | Where-Object { $_.CommandLine -notmatch '--service' } |
                     Where-Object { (Get-Process -Id $_.ProcessId -ErrorAction SilentlyContinue).MainWindowHandle -ne 0 })
              if ($w.Count) { "window open: $($w.Count)" | Out-Host; return $true }
              Start-Sleep -Seconds 1
            }
            "::warning::no Huntsman window came up on the runner: closing an open window before uninstall is unproven" | Out-Host
            return $false
          }

          # Settings that must survive the uninstall.
          New-Item -ItemType Directory -Force $data | Out-Null
          Set-Content (Join-Path $data "installer-smoke.txt") "kept"

          # 1. Silent install, per user, no admin; no service was running, so the install starts none.
          $log = Install "install"
          # Where Setup really installed (long path names, as the processes report them).
          $dir = (Get-ItemProperty $uninstKey).InstallLocation.TrimEnd("\")
          $exe = Join-Path $dir "Huntsman.exe"
          "installed in $dir"
          if ($dir -notlike "*\AppData\Local\Programs\Huntsman for Mac") { throw "not the per-user folder: $dir" }
          if (-not (Test-Path $exe)) { throw "Huntsman.exe is not in $dir" }
          if (-not (Test-Path (Join-Path $dir "setup-helper.ps1"))) { throw "setup-helper.ps1 is not installed" }
          if (-not (Test-Path $menu)) { throw "no Start menu shortcut" }
          if ((Get-ItemProperty $uninstKey).DisplayVersion -ne $env:VERSION) { throw "Settings > Apps entry missing or wrong version" }
          if (-not (Select-String -Path $log -Pattern "WebView2 Runtime (found|installed)" -Quiet)) { throw "no 'WebView2 Runtime found/installed' line" }
          Start-Sleep -Seconds 3
          if ((Services).Count) { throw "a lighting service was not started by the install, yet one is running" }

          # 2. The installed exe: --version and --self-test (to the log file, as in the zip's smoke test).
          Remove-Item -ErrorAction SilentlyContinue $env:LOG
          $v = Start-Process -FilePath $exe -ArgumentList "--version" -Wait -PassThru
          $t = Start-Process -FilePath $exe -ArgumentList "--self-test" -Wait -PassThru
          Get-Content $env:LOG
          if ($v.ExitCode -ne 0) { throw "--version exited with $($v.ExitCode)" }
          if ($t.ExitCode -ne 0) { throw "--self-test exited with $($t.ExitCode)" }
          if (-not (Select-String -Path $env:LOG -SimpleMatch "Huntsman for Mac $env:VERSION" -Quiet)) { throw "no version line" }
          if (-not (Select-String -Path $env:LOG -SimpleMatch "self-test passed" -Quiet)) { throw "self-test did not pass" }

          # 3. An upgrade (reinstall) over a running lighting service: stopped first (it logs the quit and restores
          #    the lighting), files replaced, then started again because it was running.
          StartService
          $before = (Services).ProcessId
          $log = Install "reinstall"
          if (-not (Select-String -Path $log -SimpleMatch "--quit-service exited with 0" -Quiet)) { throw "--quit-service failed before the reinstall" }
          if (-not (Select-String -Path $env:LOG -SimpleMatch "asked to quit; stopping Studio and restoring the keyboard's own lighting" -Quiet)) { throw "the service didn't log the quit" }
          if (-not (Test-Path $exe)) { throw "Huntsman.exe missing after the reinstall" }
          for ($i = 0; $i -lt 20 -and -not (Services).Count; $i++) { Start-Sleep -Seconds 1 }
          $after = (Services).ProcessId
          if (-not $after -or ($after | Where-Object { $before -contains $_ })) { throw "the lighting service was not restarted after the upgrade" }
          "service restarted after the upgrade: $before -> $after"

          # 4. Moving from an unzipped copy: its service runs and the Run value starts it. Setup stops it, starts the
          #    installed service, and that one points the Run value at itself.
          $zipDir = Join-Path $env:RUNNER_TEMP "HuntsmanZip"
          Copy-Item -Recurse -Path dist\Huntsman -Destination $zipDir
          $zipExe = Join-Path $zipDir "Huntsman.exe"
          function ZipServices { @(Get-CimInstance Win32_Process -Filter "Name = 'Huntsman.exe'" | Where-Object { $_.ExecutablePath -eq $zipExe -and $_.CommandLine -match '--service' }) }
          Start-Process -FilePath $exe -ArgumentList "--quit-service" -Wait
          for ($i = 0; $i -lt 20 -and (Services).Count; $i++) { Start-Sleep -Seconds 1 }
          if ((Services).Count) { throw "the installed service didn't quit before the zip test" }
          Start-Process -FilePath $zipExe -ArgumentList "--service" | Out-Null
          for ($i = 0; $i -lt 20 -and -not (ZipServices).Count; $i++) { Start-Sleep -Seconds 1 }
          Start-Sleep -Seconds 5
          if (-not (ZipServices).Count) { throw "the zip copy's service didn't come up" }
          Set-ItemProperty -Path $runKey -Name $runName -Value "`"$zipExe`" --service"
          $log = Install "from-zip"
          $want = "`"$exe`" --service"
          for ($i = 0; $i -lt 30 -and (Get-ItemProperty -Path $runKey -Name $runName).$runName -ne $want; $i++) { Start-Sleep -Seconds 1 }
          $now = (Get-ItemProperty -Path $runKey -Name $runName).$runName
          "Run value after the move: $now"
          if ($now -ne $want) { throw "the Run value doesn't start the installed copy: $now" }
          if ((ZipServices).Count) { throw "the zip copy's service is still running" }
          if (-not (Services).Count) { throw "the installed service isn't running after the move from the zip copy" }
          "moved from the zip copy: Run value and service now the installed copy's"

          # 5. Silent uninstall with the service (and, if the runner can show one, a window) running.
          if (-not (Get-ItemProperty -Path $runKey -Name $runName -ErrorAction SilentlyContinue)) { Set-ItemProperty -Path $runKey -Name $runName -Value "`"$exe`" --service" }
          if (-not ((Get-Content $state -Raw | ConvertFrom-Json).autostart_added)) { throw "the service didn't record autostart_added" }
          $window = StartWindow
          if (-not (Services).Count) { StartService }
          $ulog = Join-Path $env:RUNNER_TEMP "uninstall.log"
          $u = Start-Process -FilePath (Join-Path $dir "unins000.exe") -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/LOG=`"$ulog`"" -Wait -PassThru
          # the uninstaller finishes from a copy in %TEMP%: wait until the folder is gone
          for ($i = 0; $i -lt 90 -and (Test-Path $dir); $i++) { Start-Sleep -Seconds 1 }
          Get-Content -ErrorAction SilentlyContinue $ulog
          if ($u.ExitCode -ne 0) { throw "the uninstaller exited with $($u.ExitCode)" }
          if (-not (Select-String -Path $ulog -SimpleMatch "--quit-service exited with 0" -Quiet)) { throw "--quit-service failed before the uninstall" }
          if ($window -and -not (Select-String -Path $ulog -Pattern "windows closed: [1-9]" -Quiet)) { throw "the open window was not closed first" }
          if ((Ours).Count) { throw "Huntsman.exe still running from $dir" }
          if (Test-Path $dir) { Get-ChildItem -Recurse $dir | Select-Object -First 20 FullName; throw "$dir is still there" }
          if (Test-Path $menu) { throw "the Start menu shortcut is still there" }
          if (Test-Path $uninstKey) { throw "the Settings > Apps entry is still there" }
          if ($null -ne (Get-ItemProperty -Path $runKey -Name $runName -ErrorAction SilentlyContinue)) { throw "the Run value $runName is still there" }
          if ((Get-Content (Join-Path $data "installer-smoke.txt")) -ne "kept") { throw "the settings in %APPDATA% were not kept" }
          if ((Get-Content $state -Raw | ConvertFrom-Json).autostart_added) { throw "autostart_added was not reset in state.json" }
          "install (no service started), upgrade over a running service (stopped, restarted), uninstall: all good"
      - uses: actions/upload-artifact@v5
        with:
          name: Huntsman-for-Windows-${{ steps.version.outputs.version }}-Setup
          path: dist/${{ steps.setup.outputs.setup }}
          if-no-files-found: error

  release:
    needs: build
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: Huntsman-for-Windows-${{ needs.build.outputs.version }}
      - uses: actions/download-artifact@v5
        with:
          name: Huntsman-for-Windows-${{ needs.build.outputs.version }}-Setup
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.event.release.tag_name }}
          VERSION: ${{ needs.build.outputs.version }}
          ZIP: ${{ needs.build.outputs.zip }}
          SETUP: ${{ needs.build.outputs.setup }}
        run: |
          if [ "${TAG#v}" != "$VERSION" ]; then
            echo "::error::release tag $TAG doesn't match the built version $VERSION"
            exit 1
          fi
          gh release upload "$TAG" "$ZIP" "$SETUP" --clobber
